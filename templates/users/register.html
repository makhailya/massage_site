{% extends 'base.html' %}

{% block title %}Регистрация{% endblock %}

{% block content %}
<section style="padding: 80px 40px; max-width: 500px; margin: 0 auto;">
    <p style="color: #c9a96e; letter-spacing: 4px; font-size: 13px; margin-bottom: 15px; text-align: center;">
        СОЗДАТЬ АККАУНТ
    </p>
    <h1 style="text-align: center; font-size: 42px; font-weight: 300; margin-bottom: 50px;">
        Регистрация
    </h1>

    <form method="post" style="display: grid; gap: 20px;">
        {% csrf_token %}
        {% for field in form %}
        <div>
            <label style="display: block; color: #c9a96e; font-size: 13px; letter-spacing: 2px; margin-bottom: 8px;">
                {{ field.label|upper }}
            </label>
            {{ field }}
            {% if field.errors %}
                <p style="color: #e74c3c; font-size: 13px; margin-top: 5px;">
                    {{ field.errors.0 }}
                </p>
            {% endif %}
        </div>
        {% endfor %}
        <button type="submit" class="btn" style="width: 100%; padding: 15px; margin-top: 10px;">
            Зарегистрироваться
        </button>
    </form>

    <p style="text-align: center; color: #666; margin-top: 25px;">
        Уже есть аккаунт? 
        <a href="/accounts/login/" style="color: #c9a96e;">Войти</a>
    </p>
</section>
{% endblock %}
