name: Publish landing to GitHub Pages

"on":
  push:
    branches: [main]
    paths:
      - index.html
      - massage/**
      - sitemap.xml
      - css/**
      - js/**
      - assets/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6.0.0

      - name: Prepare public files
        shell: bash
        env:
          PACKAGED_SITE: ${{ runner.temp }}/pages
        run: |
          set -euo pipefail
          mkdir -p "$PACKAGED_SITE"
          cp index.html sitemap.xml "$PACKAGED_SITE/"
          cp -R css js assets massage "$PACKAGED_SITE/"

      - name: Upload public files
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: ${{ runner.temp }}/pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
